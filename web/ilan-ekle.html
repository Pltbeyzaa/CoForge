          if (!menu.contains(event.target)) {
            menu.classList.remove("open");
            toggle.setAttribute("aria-expanded", "false");
          }
        });
      }

      function showSuccessToast(message) {
        const toast = document.createElement("div");
        toast.className = "settings-toast";
        toast.innerHTML = `
          <span class="settings-toast-icon">✓</span>
          <span class="settings-toast-text">${message}</span>

        document.body.appendChild(toast);
        requestAnimationFrame(() => toast.classList.add("show"));
        window.setTimeout(() => {
          toast.classList.remove("show");
          toast.classList.add("hide");
          window.setTimeout(() => toast.remove(), 360);

      function normalizeLanguageSkill(language) {
        const map = {
          JavaScript: "JavaScript",
          TypeScript: "TypeScript",
          Python: "Python",
          Dart: "Dart",
          Java: "Java",
          "C#": "C#",
          Go: "Go",
          Rust: "Rust",
          PHP: "PHP",
          Ruby: "Ruby",
          HTML: "HTML5",
          CSS: "CSS3",
          SQL: "SQL",
        };
        return map[language] || language;
      }

      function getGithubKeywordSkills(repos) {
        const skillMap = {
          django: "Django",
          flask: "Flask",
          fastapi: "FastAPI",
          react: "React",
          "next.js": "Next.js",
          nextjs: "Next.js",
          vue: "Vue.js",
          angular: "Angular",
          flutter: "Flutter",
          docker: "Docker",
          kubernetes: "Kubernetes",
          postgres: "PostgreSQL",
          postgresql: "PostgreSQL",
          mysql: "MySQL",
          mongodb: "MongoDB",
          redis: "Redis",
          firebase: "Firebase",
          graphql: "GraphQL",
          rest: "REST API",
          api: "REST API",
          tensorflow: "TensorFlow",
          pytorch: "PyTorch",
          nlp: "NLP",
          openai: "OpenAI API",
          langchain: "LangChain",
        };
        const found = new Set();
        repos.forEach((repo) => {
          const text = `${repo?.name || ""} ${repo?.description || ""}`.toLowerCase();
          Object.entries(skillMap).forEach(([keyword, skill]) => {
            if (text.includes(keyword)) found.add(skill);
          });
        });
        return found;
      }

      async function fetchGithubPortfolio(username, token = "") {
        const headers = token ? { Authorization: `Bearer ${token}` } : {};
        const resp = await fetch(`https://api.github.com/users/${encodeURIComponent(username)}/repos?per_page=100&sort=updated`, { headers });
        if (!resp.ok) {
          throw new Error(resp.status === 404 || resp.status === 403 ? "Profil Bulunamadi" : "GitHub verisi alinamadi");
        }
        const repos = await resp.json();
        const repoList = Array.isArray(repos) ? repos.filter((repo) => !repo.fork) : [];
        const ranked = repoList
          .slice()
          .sort((a, b) => {
            const aScore = (a?.stargazers_count || 0) * 1000 + new Date(a?.pushed_at || 0).getTime();
            const bScore = (b?.stargazers_count || 0) * 1000 + new Date(b?.pushed_at || 0).getTime();
            return bScore - aScore;
          })
          .slice(0, 4);

        const languageSet = new Set();
        ranked.forEach((repo) => {
          if (repo?.language) languageSet.add(normalizeLanguageSkill(repo.language));
        });
        const keywordSkills = getGithubKeywordSkills(ranked);
        const skills = Array.from(new Set([...Array.from(languageSet), ...Array.from(keywordSkills)])).slice(0, 12);
        const mappedProjects = ranked.map((repo) => ({
          title: repo?.name || "Basliksiz Proje",
          description: (repo?.description || "GitHub reposundan ice aktarildi.").trim(),
          repo_url: repo?.html_url || "",
          stars: repo?.stargazers_count || 0,
          language: normalizeLanguageSkill(repo?.language || ""),
        }));
        return { topProjects: mappedProjects, skills };
      }

      function animateLoadBar(targetId, targetPercent = 92) {
        const fill = document.getElementById(targetId);
        if (!fill) return () => {};
        let value = 0;
        fill.style.width = "0%";
        const timer = window.setInterval(() => {
          value += Math.max(1, Math.floor((targetPercent - value) / 6));
          if (value >= targetPercent) {
            value = targetPercent;
            window.clearInterval(timer);
          }
          fill.style.width = `${value}%`;
        }, 90);
        return () => {
          window.clearInterval(timer);
          fill.style.width = "100%";
        };
      }

      function renderDetectedSkillsPost(skills) {
        const wrap = document.getElementById("githubDetectedSkillsPost");
        if (!wrap) return;
        wrap.innerHTML = skills
          .map((skill, idx) => `<span class="github-detected-pill" style="animation-delay:${idx * 0.05}s">${skill}</span>`)
          .join("");
      }

      function renderProjectSelectionPost(projects) {
        const wrap = document.getElementById("githubProjectSelectListPost");
        const confirm = document.getElementById("btnGithubImportConfirmPost");
        if (!wrap || !confirm) return;
        wrap.innerHTML = projects
          .map((project, idx) => {
            const title = (project?.title || "").trim() || "Basliksiz Proje";
            return `
              <article class="github-project-option">
                <label>
                  <input type="checkbox" class="github-project-checkbox-post" value="${idx}" checked />
                  <span>
                    <strong>${title}</strong>
                    <span class="github-project-meta">★ ${project?.stars || 0}</span>
                  </span>
                </label>
              </article>
            `;
          })
          .join("");
        confirm.disabled = !projects.length;
      }

      async function beginGithubFetchPost(useToken = false) {
        const username = window.prompt("GitHub kullanici adini girin:");
        if (!username || !username.trim()) return;
        const token = useToken ? String(document.getElementById("githubTokenInputPost")?.value || "").trim() : "";
        const stopLoad = animateLoadBar("githubLoadFillPost");

        try {
          const { topProjects, skills } = await fetchGithubPortfolio(username.trim(), token);
          githubImportStatePost = { username: username.trim(), token, projects: topProjects, skills };
          renderDetectedSkillsPost(skills);
          renderProjectSelectionPost(topProjects);
          stopLoad();
        } catch (_err) {
          showErrorToast("Profil Bulunamadi");
        }
      }

      function finalizeGithubImportPost() {
        const checks = Array.from(document.querySelectorAll(".github-project-checkbox-post:checked"));
        const selectedIndexes = checks.map((el) => Number(el.value)).filter((n) => Number.isFinite(n));
        const selectedProjects = selectedIndexes.map((idx) => githubImportStatePost.projects[idx]).filter(Boolean);
        const featured = selectedProjects[0];
        if (featured) {
          document.getElementById("projectTitle").value = featured.title || "";
          document.getElementById("projectDescription").value = [featured.description || "", `GitHub Repo: ${featured.repo_url || "-"}`].join("\n").trim();
        }

        if (githubImportStatePost.skills.length) {
          const existing = new Set(selectedSkillsState.map((item) => String(item.name || "").toLowerCase()));
          githubImportStatePost.skills.forEach((skill) => {
            if (!existing.has(skill.toLowerCase())) {
              selectedSkillsState.push({ id: null, name: skill });
            }
          });
          renderSelectedSkills();
        }

        const currentUser = authGetCurrentUser() || {};
        authSetCurrentUser({
          ...currentUser,
          github_username: githubImportStatePost.username || currentUser.github_username || "",
          github_verified: true,
        });
        updatePreview();
        closeGithubModalPost();
        showSuccessToast("Secilen GitHub projeleri forma uygulandi.");
      }

      function parseSkills() {
        return selectedSkillsState.map((s) => ({ id: s.id, name: s.name }));
      }

      function buildDescription() {
        const base = document.getElementById("projectDescription").value.trim();
        const category = document.getElementById("projectCategory").value;
        const level = document.getElementById("projectLevel").value;
        const workMode = document.getElementById("projectWorkMode").value;
        const duration = document.getElementById("projectDuration").value;
        const outputs = document.getElementById("projectOutputs").value.trim();
        const skills = parseSkills().map((s) => s.name).filter(Boolean);
        const lines = [base, "", "=== ILAN DETAYLARI ===", `Kategori: ${category}`, `Deneyim Seviyesi: ${level}`, `Calisma Modeli: ${workMode}`, `Tahmini Sure (hafta): ${duration || "-"}`, `Gerekli Yetkinlikler: ${skills.join(", ") || "-"}`, "Beklenen Ciktilar:", outputs || "-"];
        return lines.join("\n").trim();
      }

      function updatePreview() {
        const title = document.getElementById("projectTitle").value.trim();
        const description = buildDescription();
        const teamSize = document.getElementById("projectTeamSize").value;
        document.getElementById("projectPreview").value = [`Baslik: ${title || "-"}`, `Max Takim: ${teamSize || "-"}`, "", description].join("\n");
      }

      function renderSelectedSkills() {
        const wrap = document.getElementById("selectedSkills");
        wrap.innerHTML = "";
        selectedSkillsState.forEach((skill) => {
          const tag = document.createElement("button");
          tag.type = "button";
          tag.className = "post-skill-badge";
          tag.innerHTML = `<span>${skill.name}</span><span class="post-skill-remove">×</span>`;
          tag.addEventListener("click", () => {
            const idx = selectedSkillsState.findIndex((x) => x.id === skill.id);
            if (idx >= 0) selectedSkillsState.splice(idx, 1);
            renderSelectedSkills();
            updatePreview();
          });
          wrap.appendChild(tag);
        });
      }

      async function loadSkillsOptions() {
        async function fetchSkills() {
          const listResp = await fetch(`${getApiBase()}/skills/`, {
            method: "GET",
            headers: getHeaders(),
          });
          return authParseResponse(listResp);
        }

        let skillList = await fetchSkills();
        if (!Array.isArray(skillList) || skillList.length === 0) {
          const defaults = SKILL_GROUPS.flatMap((group) => group.skills);
          for (const name of defaults) {
            try {
              const createResp = await fetch(`${getApiBase()}/skills/`, {
                method: "POST",
                headers: getHeaders(true),
                body: JSON.stringify({ name }),
              });
              await authParseResponse(createResp);
            } catch (_err) {}
          }
          skillList = await fetchSkills();
        }

        const select = document.getElementById("requiredSkillSelect");
        const idByName = new Map(
          (skillList || [])
            .filter((s) => s && s.name)
            .map((s) => [String(s.name).trim().toLowerCase(), s.id])
        );

        // HTML'deki optgroup/option yapisini koru, sadece option value'larini backend skill id ile esle.
        select.querySelectorAll("option").forEach((opt) => {
          const label = (opt.textContent || "").trim();
          const currentValue = (opt.value || "").trim();
          if (!label || !currentValue) return;
          const mappedId = idByName.get(label.toLowerCase()) || idByName.get(currentValue.toLowerCase());
          if (mappedId) {
            opt.value = String(mappedId);
            opt.dataset.skillName = label;
          }
        });
      }

      async function ensureSkillIds(selectedSkills) {
        if (!selectedSkills.length) return [];

        const listResp = await fetch(`${getApiBase()}/skills/`, {
          method: "GET",
          headers: getHeaders(),
        });
        const skillList = await authParseResponse(listResp);
        const idByName = new Map(
          (skillList || [])
            .filter((s) => s && s.name)
            .map((s) => [String(s.name).trim().toLowerCase(), s.id])
        );

        const resolved = [];
        for (const skill of selectedSkills) {
          const numericId = Number(skill.id);
          if (Number.isFinite(numericId) && numericId > 0) {
            resolved.push(numericId);
            continue;
          }

          const skillName = String(skill.name || "").trim();
          if (!skillName) continue;
          let foundId = idByName.get(skillName.toLowerCase());

          if (!foundId) {
            const createResp = await fetch(`${getApiBase()}/skills/`, {
              method: "POST",
              headers: getHeaders(true),
              body: JSON.stringify({ name: skillName }),
            });
            const created = await authParseResponse(createResp);
            foundId = created.id;
            idByName.set(skillName.toLowerCase(), foundId);
          }

          if (foundId) resolved.push(foundId);
        }

        return Array.from(new Set(resolved));
      }

      function finishSaveSuccess(saveButton, redirectId, metaText, toastMsg) {
        setMeta(metaText);
        saveButton.textContent = "Kaydedildi! ✓";
        saveButton.classList.add("is-success");
        showSuccessToast(toastMsg);
        window.setTimeout(() => {
          const targetUrl = redirectId ? `ilan-detay.html?id=${encodeURIComponent(String(redirectId))}` : "ilan-detay.html";
          window.location.href = targetUrl;
        }, 1500);
      }

      async function createProjectOffline(saveButton, title, description, teamSize, selectedSkills) {
        const localId = `local_${Date.now()}`;
        const currentUser = authGetCurrentUser() || {};
        const postPayload = {
          id: localId,
          title,
          description,
          max_team_size: teamSize,
          status: "open",
          owner_email: currentUser.email || "",
          owner_role: currentUser.title || "Proje Sahibi",
          required_skills_detail: selectedSkills.map((s) => ({ skill_name: s.name })),
          created_at: new Date().toISOString(),
        };
        coforgeSaveLocalProjectPost(postPayload);
        persistProjectForCurrentUser({
          source: "coforge_ilan",
          id: localId,
          title,
          description,
          skills: selectedSkills,
          created_at: new Date().toISOString(),
        });
        latestProjectId = localId;
        finishSaveSuccess(
          saveButton,
          localId,
          `Ilan kaydedildi (yerel). ID: ${localId}`,
          "Ilaniniz kaydedildi (mock oturum: sunucuya gonderilmedi)."
        );
      }

      async function createProject() {
        const saveButton = document.getElementById("btnCreateProject");
        const title = document.getElementById("projectTitle").value.trim();
        const description = buildDescription();
        const teamSize = parseInt(document.getElementById("projectTeamSize").value, 10) || null;
        const selectedSkills = parseSkills();

        if (!title || !description) {
          setMeta("Baslik ve aciklama zorunludur.");
          return;
        }
        if (selectedSkills.length === 0) {
          setMeta("En az 1 gerekli yetkinlik gir.");
          return;
        }

        setMeta("Ilan kaydediliyor...");
        saveButton.disabled = true;
        saveButton.textContent = "Kaydediliyor...";
        try {
          if (authIsMockSession()) {
            await createProjectOffline(saveButton, title, description, teamSize, selectedSkills);
            return;
          }

          const skillIds = await ensureSkillIds(selectedSkills);
          const requiredSkills = skillIds.map((id) => ({ skill_id: id, priority: 1 }));

          const resp = await fetch(`${getApiBase()}/project-posts/`, {
            method: "POST",
            headers: getHeaders(true),
            body: JSON.stringify({
              title,
              description,
              status: "open",
              max_team_size: teamSize,
              required_skills: requiredSkills,
            }),
          });
          const data = await authParseResponse(resp);
          persistProjectForCurrentUser({
            source: "coforge_ilan",
            id: data?.id || null,
            title,
            description,
            skills: selectedSkills,
            created_at: new Date().toISOString(),
          });
          latestProjectId = data.id;
          finishSaveSuccess(saveButton, data?.id, `Ilan olusturuldu. ID: #${data.id}`, "Ilaniniz basariyla olusturuldu.");
        } catch (err) {
          setMeta(err.message || "Ilan kaydedilemedi.");
          saveButton.disabled = false;
          saveButton.textContent = "Ilani Kaydet";
          saveButton.classList.remove("is-success");
        }
      }

      function getUserProjectsStorageKey(email) {
        return `coforge_projects_${String(email || "").toLowerCase()}`;
      }

      function persistProjectForCurrentUser(project) {
        const currentUser = authGetCurrentUser();
        const email = (currentUser?.email || "").trim().toLowerCase();
        if (!email) return;

        const key = getUserProjectsStorageKey(email);
        let list = [];
        try {
          const raw = (localStorage.getItem(key) || "").trim();
          const parsed = raw ? JSON.parse(raw) : [];
          list = Array.isArray(parsed) ? parsed : [];
        } catch (_err) {
          list = [];
        }

        list.unshift(project);
        localStorage.setItem(key, JSON.stringify(list.slice(0, 30)));
      }

      async function analyzeProject() {
        if (!latestProjectId) {
          setMeta("Once ilani kaydet.");
          return;
        }
        setMeta("NLP analizi calisiyor...");
        try {
          const resp = await fetch(`${getApiBase()}/project-posts/${latestProjectId}/analyze/`, {
            method: "POST",
            headers: getHeaders(true),
            body: JSON.stringify({ max_tags: 10 }),
          });
          const data = await authParseResponse(resp);
          const tags = (data.tags || []).join(", ");
          setMeta(`Analiz tamamlandi. Tag: ${tags || "-"}`);
        } catch (err) {
          setMeta(err.message || "Analiz basarisiz.");
        }
      }

      document.getElementById("btnCreateProject").addEventListener("click", createProject);
      document.getElementById("btnAnalyzeProject").addEventListener("click", analyzeProject);
      document.getElementById("btnPreview").addEventListener("click", updatePreview);
      document.getElementById("projectTitle").addEventListener("input", updatePreview);
      document.getElementById("projectDescription").addEventListener("input", updatePreview);
      document.getElementById("projectOutputs").addEventListener("input", updatePreview);
      document.getElementById("projectCategory").addEventListener("change", updatePreview);
      document.getElementById("projectLevel").addEventListener("change", updatePreview);
      document.getElementById("projectWorkMode").addEventListener("change", updatePreview);
      document.getElementById("projectDuration").addEventListener("input", updatePreview);
      document.getElementById("projectTeamSize").addEventListener("input", updatePreview);
      document.getElementById("btnAddSkill").addEventListener("click", () => {
        const select = document.getElementById("requiredSkillSelect");
        const selectedOption = select.options[select.selectedIndex];
        const rawValue = String(select.value || "").trim();
        const id = Number(rawValue);
        const name = (selectedOption?.dataset.skillName || selectedOption?.textContent || "").trim();
        if (!rawValue || !name) return;
        if (selectedSkillsState.some((x) => x.name.toLowerCase() === name.toLowerCase())) return;
        selectedSkillsState.push({ id: Number.isFinite(id) && id > 0 ? id : null, name });
        renderSelectedSkills();
        updatePreview();
      });
      document.getElementById("btnReloadSkills").addEventListener("click", async () => {
        try {
          await loadSkillsOptions();
          setMeta("Yetkinlik listesi guncellendi.");
          updatePreview();
        } catch (err) {
          setMeta(err.message || "Yetkinlikler yuklenemedi.");
        }
      });
      document.getElementById("btnLogoutMenu").addEventListener("click", () => {
        authClearSession();
        window.location.href = "login.html";
      });
      document.getElementById("btnGithubImportPost").addEventListener("click", openGithubModalPost);
      document.getElementById("btnGithubQuickConnectPost").addEventListener("click", () => beginGithubFetchPost(false));
      document.getElementById("btnGithubTokenConnectPost").addEventListener("click", () => beginGithubFetchPost(true));
      document.getElementById("btnGithubImportConfirmPost").addEventListener("click", finalizeGithubImportPost);
      document.getElementById("btnGithubModalCancelPost").addEventListener("click", closeGithubModalPost);
      document.querySelector("#githubConnectModalPost [data-close-modal-post='true']")?.addEventListener("click", closeGithubModalPost);

      initGlobalBackgroundSpotlight();
      initProfileMenu();
      coforgeInitHeaderAvatar();

      (async () => {
        try {
          await loadSkillsOptions();
        } catch (_err) {
          setMeta("Yetkinlik listesi yuklenemedi.");
        }
        updatePreview();
      })();
    </script>
  </body>
</html>
